    <!--
      THESIS: AI spend read as an exchange quotation board, not a KPI dashboard. It
      refuses the FinOps default of gradient metric tiles over a dark navy shell,
      because a tile asserts a number while a board quotes one — and every figure here
      has to survive being questioned.
      OWN-WORLD: A graphite board face mounted on grey quotation stock. Split-flap
      cells, brass tabs, hairline rules, exchange red for spend and green for
      efficiency. Archivo for lettering, JetBrains Mono for every figure. No cards,
      no shadows as decoration, alignment does the work.
      STORY: The engineer sets the registration — window, group, account, model,
      confidence — then the board quotes what those stops allow. The analyst reads the
      board, follows a row down to the model or agent, and sees where the number came
      from before being asked.
      FIRST VIEWPORT: Full-bleed graphite board across the top carrying six quotation
      cells; the registration rail sits directly beneath it on the left, the tape of
      daily spend runs the full width under the board. Refresh is the primary action,
      set in brass at the board's right edge.
      FORM: Exchange quotation board, candidate 3 of the grounded list, staged as a
      pipe-organ keydesk registration. Seed key 2058ef78.
